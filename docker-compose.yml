services:
  postgres:
    image: postgres:17-alpine
    container_name: businessos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: businessos
      POSTGRES_PASSWORD: change_this_local_password
      POSTGRES_DB: businessos
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - businessos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U businessos -d businessos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  businessos_pgdata: